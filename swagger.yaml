openapi: 3.0.0
info:
  title: Stich Sure API
  version: 1.0.0
  description: API documentation for Stich Sure backend - A fashion designer and customer collaboration platform.
servers:
  - url: http://localhost:5000/api/v1
    description: Development server
tags:
  - name: Customer Authentication
  - name: Designer Authentication
  - name: Designer Profiles
  - name: Designs
  - name: Requests
  - name: Orders
  - name: Payments
  - name: Collaborations
  - name: Designer Wallet
  - name: Shipping (Shipbubble)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: { type: object }

    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: "customer" }
        isEmailVerified: { type: boolean }
        profilePhoto: { type: object }

    Designer:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: "designer" }
        isEmailVerified: { type: boolean }

    DesignerProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        businessName: { type: string }
        currentHouseAddress: { type: string }
        phoneNumber: { type: string }
        specialization: { type: array, items: { type: string } }
        yearsOfExperience: { type: integer }
        shortBio: { type: string }
        profilePhoto: { type: string, format: uri }
        completedOrders: { type: integer }
        reliabilityScore: { type: integer }
        ratingAverage: { type: number, format: float }
        ratingCount: { type: integer }
        isProfileCompleted: { type: boolean }

    Design:
      type: object
      properties:
        id: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        designTitle: { type: string }
        category: { type: string }
        price: { type: number }
        description: { type: string }
        designImage: { type: string, format: uri }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string }
        requestId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        designerId: { type: string, format: uuid }
        designId: { type: string, format: uuid }
        itemName: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [new, preparing, ready, completed, cancelled] }
        address: { type: string }
        placedAt: { type: string, format: date-time }

paths:
  # --- CUSTOMER AUTH ---
  /customer/register:
    post:
      tags: [Customer Authentication]
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        201: { description: Customer created }

  /customer/login:
    post:
      tags: [Customer Authentication]
      summary: Login as a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        200: { description: Login successful }

  # --- DESIGNER AUTH & PROFILES ---
  /designer/create:
    post:
      tags: [Designer Authentication]
      summary: Register a new designer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, email, password]
              properties:
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string, format: email }
                password: { type: string }
      responses:
        201: { description: Designer created }

  /designer-profile/onboarding:
    post:
      tags: [Designer Profiles]
      summary: Complete designer onboarding
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [businessName, currentHouseAddress, phoneNumber, bankName, accountNumber, accountName]
              properties:
                businessName: { type: string }
                currentHouseAddress: { type: string }
                phoneNumber: { type: string }
                specialization: { type: string, description: "JSON array string" }
                yearsOfExperience: { type: integer }
                shortBio: { type: string }
                bankName: { type: string }
                accountNumber: { type: string }
                accountName: { type: string }
                profilePhoto: { type: string, format: binary }
      responses:
        200: { description: Onboarding completed }

  /designer-profile/getAll:
    get:
      tags: [Designer Profiles]
      summary: Get all designers
      responses:
        200: { description: Success }

  /designer-profile/dashboard-stats:
    get:
      tags: [Designer Profiles]
      summary: Get dashboard analytics
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Success }

  # --- DESIGNS ---
  /designs/create:
    post:
      tags: [Designs]
      summary: Create a new design portfolio item
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [designTitle, category, price, description, designImage]
              properties:
                designTitle: { type: string }
                category: { type: string }
                price: { type: number }
                description: { type: string }
                measurement: { type: string }
                designImage: { type: string, format: binary }
      responses:
        201: { description: Design created }

  /designs/getAll:
    get:
      tags: [Designs]
      summary: Fetch all designs
      responses:
        200: { description: Success }

  # --- REQUESTS ---
  /request/create:
    post:
      tags: [Requests]
      summary: Customer creates a bespoke request
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [designerId, fullName, measurement, description]
              properties:
                designerId: { type: string, format: uuid }
                fullName: { type: string }
                deadLine: { type: string, format: date-time }
                measurement: { type: string }
                description: { type: string }
      responses:
        201: { description: Request created }

  /request/send-offer/{id}:
    put:
      tags: [Requests]
      summary: Designer sends price/offer for a request
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                designerMessage: { type: string }
      responses:
        200: { description: Offer sent }

  # --- ORDERS ---
  /order/create:
    post:
      tags: [Orders]
      summary: Create order from request or design
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemName, amount, address]
              properties:
                requestId: { type: string, format: uuid }
                designerId: { type: string, format: uuid }
                designId: { type: string, format: uuid }
                itemName: { type: string }
                amount: { type: integer }
                address: { type: string }
      responses:
        201: { description: Order created }

  /order/{id}/status:
    put:
      tags: [Orders]
      summary: Update order tracking status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [preparing, ready, completed, cancelled, picked_up, delivered] }
      responses:
        200: { description: Status updated }

  # --- PAYMENTS ---
  /payment/initiate/{orderId}:
    post:
      tags: [Payments]
      summary: Initialize Kora payment
      security: [{ bearerAuth: [] }]
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        200: { description: Payment initialized }

  /payment/verify:
    get:
      tags: [Payments]
      summary: Verify transaction status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: reference
          in: query
          required: true
          schema: { type: string }
      responses:
        200: { description: Verification complete }

  # --- COLLABORATIONS ---
  /collaboration/create:
    post:
      tags: [Collaborations]
      summary: Invite another designer to collaborate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverDesignerId, taskType]
              properties:
                receiverDesignerId: { type: string, format: uuid }
                taskType: { type: string }
                taskDetails: { type: string }
                deadline: { type: string, format: date-time }
                currentAddress: { type: string }
                offeredPayment: { type: number }
      responses:
        201: { description: Request sent }

  # --- WALLET ---
  /designer/wallet:
    get:
      tags: [Designer Wallet]
      summary: View balance and bank info
      security: [{ bearerAuth: [] }]
      responses:
        200: { description: Success }

  /designer/wallet/transactions:
    get:
      tags: [Designer Wallet]
      summary: View earnings history
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        200: { description: Success }

  # --- SHIPPING ---
  /shipbubble/rates:
    post:
      tags: [Shipping (Shipbubble)]
      summary: Get live shipping estimates
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        200: { description: Success }

  /shipbubble/track/{orderId}:
    get:
      tags: [Shipping (Shipbubble)]
      summary: Track logistics package
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        200: { description: Success }