openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for request endpoints in the StitchSure application.
paths:
  /api/v1/request/create{designerId}:
    post:
      summary: Create a new request
      tags: [request]
      parameters:
        - in: path
          name: id
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - designerId
                - fullName
                - deadLine
                - measurement
                - description
              properties:
                designerId:
                  type: string
                  example: "c7b4f3c9-31f3-4f6e-b1d4-abc123def456"
                  description: "The ID of the designer receiving the request"
                fullName:
                  type: string
                  example: "Jane Doe"
                  description: "The full name for the request reference"
                deadLine:
                  type: string
                  format: date-time
                  example: "2026-07-15T00:00:00.000Z"
                  description: "The request deadline"
                measurement:
                  type: string
                  example: "Bust: 34, Waist: 26, Hips: 36"
                  description: "Measurement details for the request"
                description:
                  type: string
                  example: "Need a bridal dress with lace sleeves and embroidery."
                  description: "A description of the requested design"
      responses:
        '201':
          description: Request created successfully
  /api/v1/request/complete/{id}:
    put:
      summary: Mark a request as completed
      tags: [request]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The ID of the request to complete"
      responses:
        '200':
          description: Request completed successfully
        '400':
          description: Only accepted requests can be completed
        '404':
          description: Request not found
  /api/v1/request/progress/{id}:
    put:
      summary: Update request progress
      tags: [request]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The ID of the accepted request"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [picked_up, ready, delivered]
                  example: picked_up
                  description: "Progress step to apply. delivered is saved as completed."
      responses:
        '200':
          description: Request progress updated successfully
        '400':
          description: Invalid status or wrong progress order
        '403':
          description: Only the assigned designer can update progress
        '404':
          description: Request not found
  /api/v1/request/tracking/{id}:
    get:
      summary: Get request tracking details
      tags: [request]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The ID of the request to track"
      responses:
        '200':
          description: Request tracking loaded successfully
        '404':
          description: Request not found
  /api/v1/request/rate/{id}:
    put:
      summary: Rate a completed request's designer
      tags: [request]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "The ID of the completed request to rate"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rating
              properties:
                rating:
                  type: integer
                  example: 5
                  description: "Rating value between 1 and 5"
      responses:
        '200':
          description: Designer rated successfully
        '400':
          description: Rating must be between 1 and 5 or request is not completed
        '404':
          description: Request not found
  /api/v1/request:
    get:
      summary: Get all requests
      tags: [request]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Requests retrieved successfully

  /api/v1/request/{id}:
    get:
      summary: Get one request
      tags: [request]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Request retrieved successfully
        '404':
          description: Request not found
