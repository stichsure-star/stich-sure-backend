openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for payment endpoints in the StitchSure application.
paths:
  /api/v1/payment/initiate/{orderId}:
    post:
      summary: Initiate order payment
      tags: [payment]
      security:
        - bearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment initialized successfully
        '403':
          description: Customer can only pay for their own order
        '404':
          description: Customer or order not found

  /api/v1/payment/verify:
    get:
      summary: Verify payment
      tags: [payment]
      security:
        - bearerAuth: []
      parameters:
        - name: reference
          in: query
          required: true
          schema:
            type: string
          example: STICHSURE-123456789012
      responses:
        '200':
          description: Payment verification completed
        '404':
          description: Payment not found

  /api/v1/payment/webhook:
    post:
      summary: Korapay payment webhook
      tags: [payment]
      parameters:
        - name: x-korapay-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  example: charge.success
                data:
                  type: object
      responses:
        '200':
          description: Webhook processed successfully
        '401':
          description: Invalid webhook signature
        '404':
          description: Payment record not found
