openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer account endpoints in the StitchSure application.
paths:
  /api/v1/designer:
    post:
      summary: Create a new designer
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Tailor
                email:
                  type: string
                  example: janetailor@gmail.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Account created successfully
  /api/v1/designer/login:
    post:
      summary: Designer login
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: janetailor@gmail.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Logged in successfully
  /api/v1/designer/forget-password:
    post:
      summary: Request password reset OTP
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: janetailor@gmail.com
      responses:
        '200':
          description: Otp sent successfully
  /api/v1/designer/reset-password:
    post:
      summary: Set a new password
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  example: newSecureP@ssw0rd
      responses:
        '200':
          description: Password set successfully