openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer account endpoints in the StitchSure application.
paths:
  /api/v1/designer/create:
    post:
      summary: Create a new designer
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Tailor
                email:
                  type: string
                  example: janetailor@gmail.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Account created successfully
  /api/v1/designer/login:
    post:
      summary: Designer login
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: janetailor@gmail.com
                password:
                  type: string
                  example: password123
      responses:
        '200':
          description: Logged in successfully
  /api/v1/designer/verify:
    post:
      summary: Verify designer email
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  example: janetailor@gmail.com
                otp:
                  type: string
                  example: "123456"
      responses:
        '200':
          description: Designer email verified successfully
        '400':
          description: OTP is invalid or expired
        '404':
          description: Designer account not found
  /api/v1/designer/forget-password:
    post:
      summary: Forget Password
      tags: [designer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: janetailor@gmail.com
      responses:
        '200':
          description: Otp sent successfully
  /api/v1/designer/reset-password:
    post:
      summary: Reset Password
      tags: [designer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  example: newSecureP@ssw0rd
      responses:
        '200':
          description: Password reset successfully
  /api/v1/designer/resend-otp:
    post:
      summary: Resend OTP for email verification
      tags: [designer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
               - email
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        '200':
          description: OTP sent successfully
