openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for the StitchSure application, which connects customers with tailors and designers for custom clothing services.
paths:
  /api/v1/customer/register:
    post:
      summary: Create a new customer
      tags: [customer]

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
              properties:
                firstName:
                  type: string
                  example: John
                  description: "The first name of the customer"
                lastName:
                  type: string
                  example: Doe
                  description: "The last name of the customer"
                email:
                  type: string
                  example: johndoe@gmail.com
                  description: "The email address of the customer"
                password:
                  type: string
                  example: Password123!
                  description: "The password for the customer's account"
      responses:
        '201':
          description: Account created successfully
  /api/v1/customer/login:
    post:
      summary: Customer login
      tags: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                  description: "The email address of the customer"
                password:
                  type: string
                  example: Password123!
                  description: "The password for the customer's account"
      responses:
        '200':
          description: Logged in successfully 
  /api/v1/customer/forget-password:
    post:
      summary: Customer forget password
      tags: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
                  description: "The email address of the customer"
      responses:
        '200':
          description: OTP sent successfully
  /api/v1/customer/reset-password:
    post:
      summary: Customer reset password
      tags: [customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
               - password
              properties:
                password:
                  type: string
                  example: Password123!
                  description: "The new password for the customer's account"
      responses:
        '200':
          description: Password updated successfully
  /api/v1/designer/resend-otp:
    post:
      summary: Resend OTP for email verification
      tags: [designer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
               - email
              properties:
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        '200':
          description: OTP sent successfully

  /api/v1/customer/verify:
    post:
      summary: Verify customer email with OTP
      tags: [customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otp
                - email
              properties:
                otp:
                  type: string
                email:
                  type: string
                  example: johndoe@gmail.com
      responses:
        '200':
          description: Verified successfully
        '400':
          description: Invalid or expired OTP
        '404':
          description: Account not found
  /api/v1/customer/update-profile/{id}:
    put:
      summary: Update customer profile
      tags: [customer]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: "Customer ID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  example: johndoe@gmail.com
                profilePhoto:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile updated successfully
  /api/v1/customer/update-password:
    put:
      summary: Update customer password
      tags: [customer]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  example: Password123!
                  description: "The current customer password"
                newPassword:
                  type: string
                  example: NewPassw0rd!
                  description: "The new password to set"
      responses:
        '200':
          description: Password updated successfully
        '400':
          description: Invalid current password
        '404':
          description: Customer not found
  /api/v1/auth/google:
    get:
      summary: Start Google OAuth login
      tags: [auth]
      responses:
        '302':
          description: Redirect to Google for authentication
  /api/v1/auth/google/callback:
    get:
      summary: Google OAuth callback endpoint
      tags: [auth]
      responses:
        '200':
          description: Logged in successfully with Google
        '401':
          description: Google authentication failed
  
  
  