openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for the StitchSure application, which connects customers with tailors and designers for custom clothing services.
paths:
  /api/v1/notifications/getAll:
    get:
      summary: Get customer notifications
      tags: [Notification]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notifications retrieved successfully
        '500':
          description: Failed to get notifications

  /api/v1/notifications/unread-count:
    get:
      summary: Get unread notifications count
      tags: [Notification]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
        '500':
          description: Failed to get unread count

  /api/v1/notifications/read/{id}:
    put:
      summary: Mark notification as read
      tags: [Notification]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Notification ID
      responses:
        '200':
          description: Notification marked as read
        '404':
          description: Notification not found
        '500':
          description: Failed to mark notification as read

  /api/v1/notifications/read-all:
    put:
      summary: Mark all notifications as read
      tags: [Notification]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
        '500':
          description: Failed to mark all notifications as read

  /api/v1/notifications/update-progress:
    post:
      summary: Update order progress and notify customer
      tags: [Notification]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - progress
              properties:
                orderId:
                  type: string
                  example: "d7b6d44a-57d7-4a7f-9c34-2dbe78a5f123"
                  description: Order ID
                progress:
                  type: string
                  enum:
                    - still_sewing
                    - cutting_material
                    - rounding_up
                    - finished
                    - delivery
                  example: still_sewing
                  description: Current production stage
      responses:
        '200':
          description: Progress updated and customer notified
        '400':
          description: Invalid progress status
        '404':
          description: Order not found
        '500':
          description: Failed to update progress