openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer wallet endpoints in the StitchSure application.
paths:
  /api/v1/designerWallet/create:
    post:
      summary: Create a designer wallet
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bankName
                - accountNumber
                - accountName
              properties:
                bankName:
                  type: string
                  example: "GTBank"
                accountNumber:
                  type: string
                  example: "0123456789"
                accountName:
                  type: string
                  example: "Faith E"
      responses:
        '201':
          description: Wallet created successfully
        '400':
          description: A wallet already exists for this designer
  /api/v1/designerWallet/update:
    put:
      summary: Update designer wallet bank details
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankName:
                  type: string
                  example: "Access Bank"
                accountNumber:
                  type: string
                  example: "9876543210"
                accountName:
                  type: string
                  example: "Faith E"
      responses:
        '200':
          description: Wallet updated successfully
        '404':
          description: Designer wallet not found
  /api/v1/designerWallet/get:
    get:
      summary: Get logged-in designer wallet
      tags: [designerWallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designer wallet loaded successfully
        '404':
          description: Designer wallet not found
  /api/v1/designerWallet/transactions:
    get:
      summary: Get designer wallet transaction history
      tags: [designerWallet]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: Transaction history loaded successfully. Returns designerName, date, orderId/orderNumber, itemName, amount, and status.
  /api/v1/designerWallet/all:
    get:
      summary: Get all designer wallets
      tags: [designerWallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallets retrieved successfully
