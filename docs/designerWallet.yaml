openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer wallet endpoints in the StitchSure application.
paths:
  /api/v1/designerWallet/create:
    post:
      summary: Create a designer wallet
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bankName
                - accountNumber
              properties:
                bankName:
                  type: string
                  example: "GTBank"
                  description: "Bank name only is enough. bankCode is looked up automatically."
                bankCode:
                  type: string
                  example: "058"
                  description: "Optional. Only pass this if you already have the Korapay bank code."
                accountNumber:
                  type: string
                  example: "0123456789"
                accountName:
                  type: string
                  example: "Faith E"
                  description: "Optional. If omitted, account name is resolved automatically from Korapay."
      responses:
        '201':
          description: Wallet created successfully
        '400':
          description: A wallet already exists for this designer
  /api/v1/designerWallet/update:
    put:
      summary: Update designer wallet bank details
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankName:
                  type: string
                  example: "Access Bank"
                bankCode:
                  type: string
                  example: "044"
                accountNumber:
                  type: string
                  example: "9876543210"
                accountName:
                  type: string
                  example: "Faith E"
      responses:
        '200':
          description: Wallet updated successfully
        '404':
          description: Designer wallet not found
  /api/v1/designerWallet/get:
    get:
      summary: Get logged-in designer wallet
      tags: [designerWallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designer wallet loaded successfully
        '404':
          description: Designer wallet not found
  /api/v1/designerWallet/transactions:
    get:
      summary: Get designer wallet transaction history
      tags: [designerWallet]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          example: 10
      responses:
        '200':
          description: Transaction history loaded successfully. Returns designerName, date, transactionType, payoutReference, orderId/orderNumber, itemName, amount, and status.
  /api/v1/designerWallet/banks:
    get:
      summary: Get Nigerian banks and Korapay bank codes
      tags: [designerWallet]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: countryCode
          schema:
            type: string
            default: NG
          example: NG
      responses:
        '200':
          description: Banks retrieved successfully
  /api/v1/designerWallet/banks/resolve:
    post:
      summary: Resolve bank account name before saving wallet details
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountNumber
              properties:
                bankName:
                  type: string
                  example: "GTBank"
                  description: "Pass bankName or bankCode"
                bankCode:
                  type: string
                  example: "058"
                  description: "Optional if bankName is provided"
                accountNumber:
                  type: string
                  example: "0123456789"
      responses:
        '200':
          description: Bank account resolved successfully
  /api/v1/designerWallet/withdraw:
    post:
      summary: Withdraw funds to designer bank account via Korapay
      tags: [designerWallet]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  example: 50000
                  description: "Gross amount to withdraw in Naira. A NGN 100 platform fee is deducted before payout."
      responses:
        '200':
          description: Withdrawal initiated successfully
        '202':
          description: Withdrawal is processing. Final status comes via Korapay webhook.
        '400':
          description: Insufficient funds or missing bank details
        '403':
          description: Unauthorized. Only designers can withdraw funds.
        '404':
          description: Wallet not found
  /api/v1/designerWallet/all:
    get:
      summary: Get all designer wallets
      tags: [designerWallet]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallets retrieved successfully
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT