openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer profile endpoints in the StitchSure application.
paths:
  /api/v1/designerProfile/create:
    post:
      summary: Create or update designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - businessName
                - currentHouseAddress
                - phoneNumber
                - specialization
                - yearsOfExperience
                - shortBio
              properties:
                businessName:
                  type: string
                  example: "Stitch Masters"
                  description: "The designer's business name"
                currentHouseAddress:
                  type: string
                  example: "123 Fashion Avenue"
                  description: "The designer's current work address"
                phoneNumber:
                  type: string
                  example: "+2348012345678"
                  description: "The designer's phone number"
                bankName:
                  type: string
                  example: "Access Bank"
                  description: "Designer payout bank name, stored on the profile"
                accountNumber:
                  type: string
                  example: "0123456789"
                  description: "Designer payout account number, stored on the profile"
                accountName:
                  type: string
                  example: "Stitch Masters"
                  description: "Designer payout account name, stored on the profile"
                specialization:
                  type: string
                  example: "Bridal, Formal Wear"
                  description: "Designer specialization, can be comma-separated or JSON array"
                yearsOfExperience:
                  type: integer
                  example: 5
                  description: "Years of experience in the designer's field"
                shortBio:
                  type: string
                  example: "Experienced bridal and couture designer."
                  description: "Short bio of the designer"
                profilePhoto:
                  type: string
                  format: binary
                  description: "Profile photo file upload"
                firstName:
                  type: string
                  example: "John"
                  description: "The designer's first name"
                lastName:
                  type: string
                  example: "Doe"
                  description: "The designer's last name"
      responses:
        '200':
          description: Designer profile saved successfully
  /api/v1/designerProfile/onboarding:
    post:
      summary: Create or update designer profile with wallet setup
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - businessName
                - currentHouseAddress
                - phoneNumber
                - bankName
                - accountNumber
                - accountName
              properties:
                businessName:
                  type: string
                  example: "Stitch Masters"
                currentHouseAddress:
                  type: string
                  example: "123 Fashion Avenue"
                phoneNumber:
                  type: string
                  example: "+2348012345678"
                bankName:
                  type: string
                  example: "Access Bank"
                accountNumber:
                  type: string
                  example: "0123456789"
                accountName:
                  type: string
                  example: "Stitch Masters"
                specialization:
                  type: string
                  example: "[\"Bridal\", \"Formal Wear\"]"
                yearsOfExperience:
                  type: integer
                  example: 5
                shortBio:
                  type: string
                  example: "Experienced bridal and couture designer."
                profilePhoto:
                  type: string
                  format: binary
                firstName:
                  type: string
                  example: "John"
                  description: "The designer's first name"
                lastName:
                  type: string
                  example: "Doe"
                  description: "The designer's last name"                  
      responses:
        '200':
          description: Designer onboarding saved successfully. Returns the joined profile fields and wallet data.
  /api/v1/designerProfile/getAll:
    get:
      summary: Get all designer profiles
      tags: [designerProfile]
      responses:
        '200':
          description: List of all designer profiles loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "All designer profiles have been loaded successfully."
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        firstName:
                          type: string
                        lastName:
                          type: string
                        email:
                          type: string
                        profile:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            designerId:
                              type: string
                              format: uuid
                            businessName:
                              type: string
                            currentHouseAddress:
                              type: string
                            profilePhoto:
                              type: string
                            specialization:
                              type: array
                              items:
                                type: string
                            phoneNumber:
                              type: string
                            bankName:
                              type: string
                            accountNumber:
                              type: string
                            accountName:
                              type: string
                            yearsOfExperience:
                              type: integer
                            shortBio:
                              type: string
                            completedOrders:
                              type: integer
                            ratingAverage:
                              type: number
                            ratingCount:
                              type: integer
                            reliabilityScore:
                              type: integer
                            isProfileCompleted:
                              type: boolean
                            currentReliabilityTier:
                              type: string
                            nextReliabilityTier:
                              type: string
                              nullable: true
                            nextReliabilityTierThreshold:
                              type: integer
                            nextReliabilityTierProgress:
                              type: integer
                            nextReliabilityTierLabel:
                              type: string
                            totalEarnings:
                              type: integer
                              description: "Total earnings from the designer's wallet"
                            availableBalance:
                              type: integer
                              description: "Available balance from the designer's wallet"
                            withdrawn:
                              type: integer
                              description: "Total withdrawn amount from the designer's wallet"
                        wallet:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            designerId:
                              type: string
                              format: uuid
                            bankName:
                              type: string
                            accountNumber:
                              type: string
                            accountName:
                              type: string
                            totalEarnings:
                              type: integer
                            availableBalance:
                              type: integer
                            withdrawn:
                              type: integer
                        designs:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              designerId:
                                type: string
                                format: uuid
                              image:
                                type: string
                              title:
                                type: string
                              description:
                                type: string
                              price:
                                type: number
  /api/v1/designerProfile/getByDesigner/{designerId}:
    get:
      summary: Get a designer profile by designer id
      tags: [designerProfile]
      parameters:
        - in: path
          name: designerId
          required: true
          schema:
            type: string
            format: uuid
          description: "The UUID of the designer whose profile should be returned"
      responses:
        '200':
          description: Designer profile loaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Designer profile has been loaded successfully."
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      firstName:
                        type: string
                      lastName:
                        type: string
                      email:
                        type: string
                      profile:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          designerId:
                            type: string
                            format: uuid
                          businessName:
                            type: string
                          currentHouseAddress:
                            type: string
                          profilePhoto:
                            type: string
                          specialization:
                            type: array
                            items:
                              type: string
                          phoneNumber:
                            type: string
                          bankName:
                            type: string
                          accountNumber:
                            type: string
                          accountName:
                            type: string
                          yearsOfExperience:
                            type: integer
                          shortBio:
                            type: string
                          completedOrders:
                            type: integer
                          ratingAverage:
                            type: number
                          ratingCount:
                            type: integer
                          reliabilityScore:
                            type: integer
                          isProfileCompleted:
                            type: boolean
                          currentReliabilityTier:
                            type: string
                          nextReliabilityTier:
                            type: string
                            nullable: true
                          nextReliabilityTierThreshold:
                            type: integer
                          nextReliabilityTierProgress:
                            type: integer
                          nextReliabilityTierLabel:
                            type: string
                          totalEarnings:
                            type: integer
                            description: "Total earnings from the designer's wallet"
                          availableBalance:
                            type: integer
                            description: "Available balance from the designer's wallet"
                          withdrawn:
                            type: integer
                            description: "Total withdrawn amount from the designer's wallet"
        '404':
          description: Designer not found
  /api/v1/designerProfile/dashboard-stats:
    get:
      summary: Get logged-in designer dashboard stats
      tags: [designerProfile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard stats loaded successfully. Reliability starts at Bronze with score 0, then increases from completed accepted orders. Tiers are Bronze 0+, Silver 50+, Gold 90+, and Diamond 98+.
  /api/v1/designerProfile/update:
    put:
      summary: Update designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                  example: "Stitch Masters"
                currentHouseAddress:
                  type: string
                  example: "123 Fashion Avenue"
                phoneNumber:
                  type: string
                  example: "+2348012345678"
                bankName:
                  type: string
                  example: "Access Bank"
                accountNumber:
                  type: string
                  example: "0123456789"
                accountName:
                  type: string
                  example: "Stitch Masters"
                specialization:
                  type: string
                  example: "Bridal, Formal Wear"
                yearsOfExperience:
                  type: integer
                  example: 5
                shortBio:
                  type: string
                  example: "Experienced bridal and couture designer."
                profilePhoto:
                  type: string
                  format: binary
                  description: "New profile photo file upload"
      responses:
        '200':
          description: Designer profile updated successfully
        '404':
          description: Designer profile not found
  /api/v1/designerProfile/delete:
    delete:
      summary: Delete designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designer profile deleted successfully
        '404':
          description: Designer profile not found