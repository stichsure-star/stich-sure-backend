openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for designer profile endpoints in the StitchSure application.
paths:
  /api/v1/designerProfile/create:
    post:
      summary: Create or update designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - businessName
                - currentHouseAddress
                - specialization
                - yearsOfExperience
                - shortBio
              properties:
                businessName:
                  type: string
                  example: "Stitch Masters"
                  description: "The designer's business name"
                currentHouseAddress:
                  type: string
                  example: "123 Fashion Avenue"
                  description: "The designer's current work address"
                specialization:
                  type: string
                  example: "Bridal, Formal Wear"
                  description: "Designer specialization, can be comma-separated or JSON array"
                yearsOfExperience:
                  type: integer
                  example: 5
                  description: "Years of experience in the designer's field"
                shortBio:
                  type: string
                  example: "Experienced bridal and couture designer."
                  description: "Short bio of the designer"
                profilePhoto:
                  type: string
                  format: binary
                  description: "Profile photo file upload"
      responses:
        '200':
          description: Designer profile saved successfully
  /api/v1/designerProfile/getAll:
    get:
      summary: Get all designer profiles
      tags: [designerProfile]
      responses:
        '200':
          description: List of all designer profiles loaded successfully
  /api/v1/designerProfile/getByDesigner/{designerId}:
    get:
      summary: Get a designer profile by designer id
      tags: [designerProfile]
      parameters:
        - in: path
          name: designerId
          required: true
          schema:
            type: string
            format: uuid
          description: "The UUID of the designer whose profile should be returned"
      responses:
        '200':
          description: Designer profile loaded successfully
        '404':
          description: Designer not found
  /api/v1/designerProfile/update:
    put:
      summary: Update designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                businessName:
                  type: string
                  example: "Stitch Masters"
                currentHouseAddress:
                  type: string
                  example: "123 Fashion Avenue"
                specialization:
                  type: string
                  example: "Bridal, Formal Wear"
                yearsOfExperience:
                  type: integer
                  example: 5
                shortBio:
                  type: string
                  example: "Experienced bridal and couture designer."
                profilePhoto:
                  type: string
                  format: binary
                  description: "New profile photo file upload"
      responses:
        '200':
          description: Designer profile updated successfully
        '404':
          description: Designer profile not found
  /api/v1/designerProfile/delete:
    delete:
      summary: Delete designer profile
      tags: [designerProfile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Designer profile deleted successfully
        '404':
          description: Designer profile not found
  /api/v1/designerProfile/wallet:
    post:
      summary: Create a designer wallet
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bankName
                - accountNumber
                - accountName
              properties:
                bankName:
                  type: string
                  example: "GTBank"
                  description: "The designer's bank name"
                accountNumber:
                  type: string
                  example: "0123456789"
                  description: "The designer's bank account number"
                accountName:
                  type: string
                  example: "John Doe"
                  description: "The name on the bank account"
      responses:
        '201':
          description: "Designer wallet created successfully. Initial values: totalEarnings=0, availableBalance=0, withdrawn=0"
        '400':
          description: A wallet already exists for this designer. Use update instead.
  /api/v1/designerProfile/update-wallet:
    put:
      summary: Update a designer wallet
      tags: [designerProfile]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bankName:
                  type: string
                  example: "Access Bank"
                  description: "The designer's bank name"
                accountNumber:
                  type: string
                  example: "9876543210"
                  description: "The designer's bank account number"
                accountName:
                  type: string
                  example: "Jane Doe"
                  description: "The name on the bank account"
      responses:
        '200':
          description: Designer wallet updated successfully
        '404':
          description: Designer wallet not found
  /api/v1/designerProfile/get-wallet:
    get:
      summary: Get the logged-in designer's wallet
      tags: [designerProfile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "Designer wallet loaded successfully. Includes: bankName, accountNumber, accountName, totalEarnings, availableBalance, withdrawn"
        '404':
          description: Designer wallet not found
