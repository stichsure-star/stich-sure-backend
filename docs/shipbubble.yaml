openapi: 3.0.0
info:
  title: StitchSure API Documentation
  version: 1.0.0
  description: API documentation for Shipbubble shipment endpoints in the StitchSure application.
paths:
  /api/v1/shipment/rates:
    post:
      summary: Fetch shipping rates
      tags: [shipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Shipping rates retrieved successfully

  /api/v1/shipment/create:
    post:
      summary: Create shipment
      tags: [shipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Shipment created successfully

  /api/v1/shipment/track/{orderId}:
    get:
      summary: Track shipment
      tags: [shipment]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tracking information retrieved successfully

  /api/v1/shipment/validate-address:
    post:
      summary: Validate shipping address
      tags: [shipment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Address validation completed

  /api/v1/shipment/categories:
    get:
      summary: Get package categories
      tags: [shipment]
      responses:
        '200':
          description: Package categories retrieved successfully
  /api/v1/shipment/wallet/fund:
    post:
      summary: Fund Shipbubble shipping wallet
      tags: [shipment]
      description: >
        Funds the Shipbubble shipping wallet. Returns a Paystack checkout URL
        to complete the payment. Only works with production API key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  example: 5000
                  description: "Amount to fund the wallet with in Naira"
      responses:
        '200':
          description: Wallet funding request created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Retrieved successfully
                  data:
                    type: object
                    properties:
                      payment_url:
                        type: string
                        example: "https://checkout.paystack.com/un58cepyzok34gj"
                        description: "Open this URL in browser to complete wallet funding"
        '500':
          description: Failed to fund wallet          
